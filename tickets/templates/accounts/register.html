
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | HelpDesk</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-900 via-blue-950 to-indigo-900 flex items-center justify-center p-4">

    <div class="w-full max-w-md">

        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-500 rounded-2xl text-white text-2xl font-bold shadow-lg mb-4">
                H
            </div>

            <h1 class="text-3xl font-bold text-white">
                HelpDesk
            </h1>

            <p class="text-blue-200 mt-2">
                Create your account and get started.
            </p>
        </div>

        <div class="bg-white rounded-2xl shadow-2xl p-8">

            <h2 class="text-2xl font-bold text-gray-800 mb-2">
                Create Account
            </h2>

            <p class="text-gray-500 text-sm mb-6">
                Fill in your details to register.
            </p>

            {% if error %}
            <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-5 text-sm">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="mb-4">
                    <label class="block text-gray-700 font-semibold mb-2">
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        placeholder="Choose a username"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                    >
                </div>

                <div class="mb-4">
                    <label class="block text-gray-700 font-semibold mb-2">
                        Email Address
                    </label>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                    >
                </div>

                <div class="mb-6">
                    <label class="block text-gray-700 font-semibold mb-2">
                        Password
                    </label>

                    <div class="relative">
                        <input
                            type="password"
                            name="password"
                            id="password"
                            placeholder="Minimum 8 characters"
                            minlength="8"
                            required
                            class="w-full px-4 py-3 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                        >

                        <button
                            type="button"
                            onclick="togglePassword()"
                            class="absolute right-4 top-3.5 text-sm text-blue-600 font-semibold"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <button
                    type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl shadow-lg transition duration-200"
                >
                    Create Account
                </button>

            </form>

            <div class="text-center mt-6">
                <p class="text-gray-600 text-sm">
                    Already have an account?

                    <a href="{% url 'login' %}" class="text-blue-600 font-bold hover:underline">
                        Login
                    </a>
                </p>
            </div>

        </div>

        <p class="text-center text-blue-200 text-xs mt-6">
            © 2026 HelpDesk Ticket Management System
        </p>

    </div>

    <script>
        function togglePassword() {
            const password = document.getElementById("password");

            if (password.type === "password") {
                password.type = "text";
            } else {
                password.type = "password";
            }
        }
    </script>

</body>
</html>
